name: DB Backup to Supabase Storage

on:
  workflow_dispatch:
  schedule:
    # 8:00 PM Asia/Manila is 12:00 UTC
    - cron: '0 12 * * *'

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: npm ci

      - name: Export env vars
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> $GITHUB_ENV
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> $GITHUB_ENV
          echo "VITE_SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> $GITHUB_ENV
          echo "VITE_SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> $GITHUB_ENV
          echo "VITE_DATABASE_URL=${{ secrets.DATABASE_URL }}" >> $GITHUB_ENV
          echo "BACKUP_BUCKET=backup" >> $GITHUB_ENV
          echo "BACKUP_OBJECT=db/backup.sql" >> $GITHUB_ENV
          echo "CRON_TZ=Asia/Manila" >> $GITHUB_ENV

      - name: Run backup script
        run: node --experimental-strip-types scripts/backup/backup.ts
