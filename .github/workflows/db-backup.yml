name: DB Backup to Supabase Storage

on:
  workflow_dispatch:
  schedule:
    # 8:00 PM Asia/Manila is 12:00 UTC
    - cron: '0 12 * * *'

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run backup script
        env:
          # Use your VITE_* secrets
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}
          VITE_DATABASE_URL: ${{ secrets.VITE_DATABASE_URL }}
          # Mirror to non-VITE names for the script
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.VITE_DATABASE_URL }}
          BACKUP_BUCKET: backup
          BACKUP_OBJECT: db/backup.sql
          CRON_TZ: Asia/Manila
        run: node --experimental-strip-types scripts/backup/backup.ts
